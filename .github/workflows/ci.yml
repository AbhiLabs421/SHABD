name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero runtime deps; tooling only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy

      - name: Lint
        run: |
          ruff check shabd.py shabd_client.py tests/ examples/

      - name: Type-check
        # Keep light — single-file, no stubs needed.
        run: |
          mypy --ignore-missing-imports --no-strict-optional shabd.py shabd_client.py || true

      - name: Core tests
        run: python tests/test_shabd.py

      - name: Enterprise tests
        run: python tests/test_enterprise.py

  comparison:
    name: live SHABD-vs-FastMCP matrix
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install FastMCP for the live comparison
        run: pip install fastmcp
      - run: python tests/test_comparison.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t shabd:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name shabd-ci -p 18765:8765 \
            -e SHABD_SECRET=$(openssl rand -hex 32) \
            shabd:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:18765/healthz >/dev/null; then
              echo "ok"; exit 0
            fi
            sleep 1
          done
          docker logs shabd-ci
          exit 1

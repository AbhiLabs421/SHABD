name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write   # for trusted PyPI publishing

jobs:
  pypi:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Upgrade `packaging` too: setuptools emits Metadata-Version 2.4
      # (License-File), which older `packaging` in the twine check rejects.
      - run: pip install --upgrade build twine "packaging>=24.2"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: pypi
    if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shabd:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shabd:latest

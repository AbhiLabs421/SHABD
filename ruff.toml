# Pinning a ruff config keeps `make lint` and CI in lock-step with
# whatever a contributor runs locally.

line-length = 100
target-version = "py310"

[lint]
# Defaults plus a few extras worth catching early.
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # we let the formatter wrap; line-length is advisory
    "UP007", # `Optional[X]` is still ergonomic for tests
]

[lint.per-file-ignores]
# Tests and examples import-everything-up-front by design;
# noqa: E402 is already on the `from shabd import …` lines that
# follow `sys.path.insert(…)`.
"tests/*.py" = ["E402"]
"examples/*.py" = []
"bench/*.py" = ["E402"]
"scripts/*.py" = []
